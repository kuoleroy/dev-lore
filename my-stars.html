    if (v / DATA.length < 0.015) return;
    const s = el('span'); s.style.width = (v/DATA.length*100)+'%';
    s.style.background = LC[k] || '#6e7681'; s.title = k+' '+v; bar.appendChild(s);
    const item = el('span');
    item.innerHTML = '<i style="background:'+(LC[k]||'#6e7681')+'"></i>'+esc(k)+' '+v;
    leg.appendChild(item);
  });
})();

function render(){
  const kwL = kw.toLowerCase();
  let list = DATA.filter(d =>
    (lang === 'all' || d.l === lang) &&
    (!kwL || d.n.toLowerCase().includes(kwL) ||
      (d.d||'').toLowerCase().includes(kwL) ||
      (d.t||[]).some(t => t.includes(kwL)))
  );
  const cmp = {
    starred: (a,b) => b.sa.localeCompare(a.sa) || b.s - a.s,
    stars: (a,b) => b.s - a.s,
    name: (a,b) => a.n.toLowerCase().localeCompare(b.n.toLowerCase()),
    pushed: (a,b) => (b.p||'').localeCompare(a.p||''),
  }[sortBy];
  list.sort(cmp);

  $('count').textContent = list.length + ' / ' + DATA.length;
  $('empty').style.display = list.length ? 'none' : '';
  const g = $('grid');
  g.textContent = '';
  const frag = document.createDocumentFragment();
  list.forEach(d => {
    const [owner, name] = d.n.split('/');
    const card = el('div', 'item');
    const top = el('div', 'top');
    top.innerHTML = '<span class="name"><span class="own">'+esc(owner)+'/</span>'+esc(name)+'</span>' +
      '<span class="star">⭐ ' + (d.s >= 1000 ? (d.s/1000).toFixed(1)+'k' : d.s) + '</span>';
    const desc = el('div', 'desc', d.d ? esc(d.d) : '<span style="opacity:.4">暂无说明</span>');
    const meta = el('div', 'meta');
    meta.innerHTML = '<span><i class="dot" style="background:'+(LC[d.l]||'#6e7681')+'"></i>'+esc(d.l||'—')+'</span>' +
      '<span>收藏 ' + d.sa.slice(5) + '</span>' +
      (d.a ? '<span class="arc">已归档</span>' : '') +
      (d.t||[]).slice(0,2).map(t=>'<span class="topic">'+esc(t)+'</span>').join('');
    card.appendChild(top); card.appendChild(desc); card.appendChild(meta);
    card.onclick = () => window.open(d.u, '_blank');
    card.style.cursor = 'pointer';
    frag.appendChild(card);
  });
  g.appendChild(frag);
}

$('q').addEventListener('input', e => { kw = e.target.value.trim(); render(); });
$('sort').addEventListener('change', e => { sortBy = e.target.value; render(); });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); lang = b.dataset.lang; render();
});
render();
</script></body></html>
